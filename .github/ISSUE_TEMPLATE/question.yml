name: 질문·사용 문의
description: 사용 방법이나 문서에서 해결하지 못한 질문
body:
  - type: markdown
    attributes:
      value: |
        **작성 요령**
        - **제목**: 확인할 대상을 구체적으로 표현. 예: `프로젝트별 설정의 적용 우선순위 문의`
        - 오동작이 의심되면 결함 보고, 새 기능이 필요하면 기능·개선 제안 양식 사용

  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 짧은 불릿 2-3개, 명사형·단답형 종결(`~합니다`·`~습니다`·`~한다` 생략)
      placeholder: |
        - 설정 파일의 적용 순서 확인 필요
        - 프로젝트별 설정과 공통 설정의 우선순위 문의
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: 질문과 사용 상황
      description: 하려는 작업, 궁금한 점, 필요한 경우 버전·실행 환경 작성
      placeholder: |
        - 하려는 작업:
        - 궁금한 점:
    validations:
      required: true

  - type: textarea
    id: attempts
    attributes:
      label: 확인한 문서와 시도한 방법 (선택)
      description: 참고 문서, 실행 결과, 관련 이슈. 비밀키·개인정보·불필요한 로컬 경로 제거

  - type: checkboxes
    id: submission_checks
    attributes:
      label: 등록 확인
      options:
        - label: 문서와 열린 이슈에서 답을 찾지 못했는지 확인
          required: true
