name: 결함 보고
description: 오동작이나 회귀를 재현 정보와 함께 등록
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **작성 요령**
        - **제목**: 대상과 증상을 짧게 표현. 예: `공통 코덱이 없는 입력에서 후보 반환`
        - **원인**: 확인한 증상과 추정 원인을 구분. 원인을 몰라도 관찰한 증거로 등록 가능
        - **단계**: core 검사·HTML 시안·실제 장비 재현을 구분. 아직 구현되지 않은 드라이버·코덱 목표는 기능·개선 제안으로 작성
        - **이슈 번호**: 목록 안의 `#번호`는 GitHub가 제목·상태로 펼쳐 줄이 길어짐. 목록 한 줄에는 번호 하나만 쓰고 여러 번호·관계는 표나 문장으로 작성
        - **흐름도**: 재현·처리 흐름이 복잡할 때만 아래 `흐름도 (선택)`에 Mermaid로 추가. 짧은 흐름은 `입력 → 처리 → 결과`처럼 한 줄이면 충분

  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 짧은 불릿 2-3개, 명사형·단답형 종결(`~합니다`·`~습니다`·`~한다` 생략). 상세 설명과 로그는 아래에 작성
      placeholder: |
        - 공통 코덱이 없는 입력에서 후보 반환
        - 협상 불가능한 후보의 선택 방지 필요
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: 현재 동작 (AS-IS)
      description: 문제가 발생한 입력·상황과 실제 결과. 작은 결함은 1-2문장으로 충분
      placeholder: |
        - 입력·상황:
        - 실제 결과·오류:
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 기대 동작 (TO-BE)
      description: 같은 입력·상황에서 기대하는 정상 결과. 구현 방법은 적지 않음
      placeholder: |
        - 기대 결과:
    validations:
      required: true

  - type: textarea
    id: flow_diagram
    attributes:
      label: 흐름도 (선택)
      description: 흐름이 복잡할 때만 Mermaid 코드 입력(본문에는 mermaid 코드 블록으로 들어감). 실선은 현재 경로, 점선은 기대 경로. 단순한 결함은 비워 둠
      placeholder: |
        flowchart LR
          A[입력] --> B{검증}
          B -->|현재| C[잘못된 결과]
          B -.->|기대| D[정상 결과]
      render: mermaid

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법 또는 증거
      description: 최소 재현 단계와 실제 결과. 재현이 어려우면 관찰 시점·빈도·확인한 로그나 코드 기재. 기존 정상 버전과 비교했으면 그 기준도 작성
      placeholder: |
        1. 실행 환경 또는 입력 준비
        2. 문제가 발생하는 작업 수행
        3. 결과 확인
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 해당하는 항목만 작성. core는 OS·Rust·입력, 시안은 브라우저, 실기는 장비·드라이버 조건 기재. 모르는 값은 미확인, 무관한 값은 해당 없음으로 표시. 장치 주소·일련번호 제외
      placeholder: |
        - 버전 또는 커밋:
        - 확인 단계 (core / HTML 시안 / 실기):
        - OS·빌드·아키텍처 / Rust 또는 브라우저 버전:
        - 실기인 경우 어댑터·드라이버 / 헤드폰·펌웨어:
        - 실기인 경우 선택 코덱·실제 협상 코덱·샘플레이트:
        - 실기인 경우 재연결·절전·마이크 사용 / Windows 기본 경로 재현 여부:
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 영향과 참고 자료 (선택)
      description: 영향 범위, 복구 방법, 우선순위 근거와 비식별화 로그. 원시 오디오·덤프·Bluetooth 주소·일련번호·서명 키는 공개 첨부 금지

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위 제안 (선택)
      description: 영향과 증거에 근거해 제안. 모르면 미분류 유지. 담당자가 AGENTS.md 기준으로 priority 라벨 확정
      options:
        - "미분류: 영향 확인 필요"
        - "P0: 진행 중인 중대 사고"
        - "P1: 중대한 현재 결함·필수 검사 실패"
        - "P2: 현재 흐름의 개선"
        - "P3: 영향이 좁은 편의 개선"
      default: 0

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건 (선택)
      description: 같은 입력·상황에서 확인할 정상 결과와 보존할 동작. 모르면 비워 두고 구현 전 담당자가 확정
      placeholder: |
        - [ ] 재현 단계에서 기대 동작 확인
        - [ ] 기존 정상 동작 유지

  - type: textarea
    id: relationships
    attributes:
      label: 관련 이슈 (선택)
      description: 이미 확인한 중복·선행·관련 이슈가 있으면 작성. 관계 설정과 진행 계획은 구현 담당자가 필요한 때 보완
      placeholder: |
        | 관계 | 이슈 | 메모 |
        | --- | --- | --- |
        | 선행 | #번호 | 먼저 해결돼야 하는 이유 |
        | 관련 | #번호 | 같은 결함인지 비교할 내용 |

  - type: checkboxes
    id: submission_checks
    attributes:
      label: 등록 확인
      options:
        - label: 관련 이슈와 확인 가능한 최신 버전에서 같은 결함의 해결 여부 확인
          required: true
        - label: 로그·스크린샷의 비밀키·개인정보·불필요한 로컬 경로 제거 또는 해당 없음
          required: true
